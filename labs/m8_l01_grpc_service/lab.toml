id = "M8-L01"
module = 8
title = "In-Process gRPC Service & Deadlines"
difficulty = 3
time_budget_min = 50
concepts = ["grpc microservices", "status codes", "context.abort", "client deadlines", "in-process test harness"]
false_equivalences = []

[triptych]
cpp = "reference.cpp"
naive = "naive.py"
idiomatic = "_reference.py"

[runtime]
python = ">=3.12"
requires = ["grpcio", "protobuf"]
free_threading = "must-pass"
stress_repeats = 1

[[criteria]]
id = "C1"
kind = "correctness"
description = "Put and Get store and retrieve key-value pairs"
naive_must_fail = false

[[criteria]]
id = "C2"
kind = "safety"
description = "Get on missing key aborts with grpc.StatusCode.NOT_FOUND instead of returning empty payload"
naive_must_fail = true

[[criteria]]
id = "C3"
kind = "latency"
description = "Client deadline expiration aborts with grpc.StatusCode.DEADLINE_EXCEEDED"
naive_must_fail = false

[[criteria]]
id = "C4"
kind = "concurrency"
description = "Servicer safely handles concurrent Put/Get requests across worker threads"
naive_must_fail = false
